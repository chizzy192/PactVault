[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
pact_vault = "DQGA85XVQcpYtrUoTdiKowiekXPF7WcesLPLYB8XKbuh"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# Order matters: both files share the single pool, and pact_vault.ts must
# run first because its first tests expect the pool not to exist yet.
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/pact_vault.ts tests/escrow.ts"

[hooks]
